<text x="635" y="1236" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">36. Mức nguy cơ dự đoán và kết quả đánh giá riêng biệt</text>
<path d="M1010 1290 H260" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="635" y="1280" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">37. Đánh giá / đề xuất chờ duyệt, bị trả lại và đã duyệt</text>
<path d="M1010 1334 H260" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="635" y="1324" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">38. Điều kiện đánh giá lại, tiến trình và lịch sử từng vòng</text>
<path d="M1010 1378 H260" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="635" y="1368" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">39. Thông báo chờ duyệt, nhắc hạn đánh giá / đào tạo lại</text>
<path d="M1010 1422 H260" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="635" y="1412" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">40. Chính sách, trạng thái gửi và lịch sử yêu cầu hỗ trợ</text>
<text x="1200" y="1520" font-family="Arial, sans-serif" font-size="17" fill="#627797" text-anchor="middle">Phạm vi: nhân viên, trưởng ca và quản lý cửa hàng. Model và cơ sở dữ liệu thuộc nội bộ tiến trình 0.</text>
<text x="1200" y="1550" font-family="Arial, sans-serif" font-size="17" fill="#627797" text-anchor="middle">Đầu vào: mũi tên hướng vào hệ thống. Đầu ra: mũi tên hướng về tác nhân.</text>
<text x="1200" y="1580" font-family="Arial, sans-serif" font-size="17" fill="#627797" text-anchor="middle">Xác nhận thực hành / theo dõi thuộc trưởng ca phụ trách. Kết quả năng lực gửi cho nhân viên sau khi quản lý duyệt.</text></svg>
