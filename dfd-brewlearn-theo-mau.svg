<text x="1765" y="505" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">16. Nội dung bổ sung đánh giá bị trả lại</text>
<path d="M2160 590 H1370" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="1765" y="580" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">17. Nội dung nhắc học tập và ghi nhận sự cố</text>
<path d="M2160 665 H1370" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="1765" y="655" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">18. Xác nhận thực hành / theo dõi vòng được phụ trách</text>
<path d="M2160 740 H1370" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="1765" y="730" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">19. Tiến độ tự học, câu trả lời quiz và yêu cầu hỗ trợ</text>
<path d="M1370 815 H2160" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="1765" y="805" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">20. Kết quả xác thực và cập nhật tài khoản</text>
<path d="M1370 890 H2160" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="1765" y="880" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">21. Danh sách nhân viên trong ca, tiến độ và thống kê quiz</text>
<path d="M1370 965 H2160" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="1765" y="955" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">22. Danh sách nhắc hạn và điều kiện đánh giá</text>
<path d="M1370 1040 H2160" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="1765" y="1030" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">23. Lịch đánh giá, trạng thái duyệt và lý do trả lại</text>
<path d="M1370 1115 H2160" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="1765" y="1105" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">24. Kế hoạch, tiến trình và điều kiện vòng phụ trách</text>
<path d="M1370 1190 H2160" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="1765" y="1180" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">25. Nội dung tự học, điểm và lịch sử quiz của bản thân</text>
<path d="M1370 1265 H2160" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="1765" y="1255" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">26. Chính sách, trạng thái gửi và lịch sử yêu cầu hỗ trợ</text>
<rect x="40" y="825" width="220" height="600" fill="white" stroke="#202D40" stroke-width="2"/>
<text x="150" y="1125" font-family="Arial, sans-serif" font-size="22" fill="#202D40" text-anchor="middle">QUẢN LÝ</text>
<text x="150" y="1155" font-family="Arial, sans-serif" font-size="22" fill="#202D40" text-anchor="middle">CỬA HÀNG</text>
<path d="M260 850 H1010" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="635" y="840" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">27. Thông tin đăng nhập, hồ sơ và cài đặt tài khoản</text>
<path d="M260 894 H1010" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="635" y="884" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">28. Yêu cầu tìm kiếm, tra cứu và bộ lọc theo ca</text>
<path d="M260 938 H1010" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="635" y="928" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">29. Dữ liệu tạo ca, phân ca và trạng thái làm việc</text>
<path d="M260 982 H1010" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="635" y="972" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">30. Quyết định duyệt / trả lại đánh giá và lý do</text>
<path d="M260 1026 H1010" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="635" y="1016" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">31. Quyết định duyệt / từ chối đề xuất chờ duyệt</text>
<path d="M260 1070 H1010" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="635" y="1060" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">32. Kế hoạch từng vòng, trưởng ca phụ trách và thời hạn</text>
<path d="M260 1114 H1010" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="635" y="1104" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">33. Dữ liệu lịch đánh giá lại và yêu cầu hỗ trợ</text>
<path d="M1010 1158 H260" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="635" y="1148" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">34. Kết quả xác thực và cập nhật tài khoản</text>
<path d="M1010 1202 H260" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="635" y="1192" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">35. Tổng quan cửa hàng, nhân sự và hồ sơ học tập / quiz</text>
