<text x="2270" y="795" font-family="Arial, sans-serif" font-size="22" fill="#202D40" text-anchor="middle">TRƯỞNG CA</text>
<path d="M2160 215 H1370" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="1765" y="205" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">12. Thông tin đăng nhập, hồ sơ và cài đặt tài khoản</text>
<path d="M2160 290 H1370" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="1765" y="280" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">13. Yêu cầu tra cứu nhân viên, học tập và đánh giá</text>
