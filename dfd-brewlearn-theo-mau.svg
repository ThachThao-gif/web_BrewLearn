<text x="635" y="244" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">2. Yêu cầu tra cứu khóa học, bài học, quiz và thông báo</text>
<path d="M260 298 H1010" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="635" y="288" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">3. Dữ liệu tiến độ và hoàn thành bài học</text>
<path d="M260 342 H1010" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="635" y="332" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">4. Câu trả lời bài kiểm tra</text>
