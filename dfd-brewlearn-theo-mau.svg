<text x="635" y="420" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">6. Kết quả xác thực và cập nhật tài khoản</text>
<path d="M1010 474 H260" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="635" y="464" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">7. Nội dung học tập, quiz, SOP, tiêu chuẩn và chính sách</text>
<path d="M1010 518 H260" stroke="#246B5B" stroke-width="1.5" fill="none" marker-end="url(#out)"/>
<text x="635" y="508" font-family="Arial, sans-serif" font-size="16" fill="#246B5B" text-anchor="middle">8. Tiến độ, điểm và lịch sử lượt thi</text>
