<svg xmlns="http://www.w3.org/2000/svg" width="2420" height="1640" viewBox="0 0 2420 1640"><defs><marker id="in" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#334155"/></marker><marker id="out" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#246B5B"/></marker></defs><rect width="2420" height="1640" fill="white"/><text x="1200" y="65" font-family="Arial, sans-serif" font-size="32" fill="#202D40" text-anchor="middle">DFD MỨC NGỮ CẢNH — BREWLEARN</text>
<text x="1200" y="115" font-family="Arial, sans-serif" font-size="19" fill="#627797" text-anchor="middle">Các đầu vào và đầu ra được tách riêng • Mỗi mũi tên biểu diễn một luồng dữ liệu</text>
<rect x="1010" y="160" width="360" height="1300" rx="28" fill="#F7F9FC" stroke="#202D40" stroke-width="2"/>
<path d="M1010 225 H1370" stroke="#202D40" stroke-width="2"/>
<text x="1190" y="205" font-family="Arial, sans-serif" font-size="26" fill="#202D40" text-anchor="middle">0</text>
<text x="1190" y="735" font-family="Arial, sans-serif" font-size="30" fill="#202D40" text-anchor="middle">HỆ THỐNG</text>
<text x="1190" y="778" font-family="Arial, sans-serif" font-size="30" fill="#202D40" text-anchor="middle">BREWLEARN</text>
<rect x="40" y="185" width="220" height="550" fill="white" stroke="#202D40" stroke-width="2"/>
<text x="150" y="460" font-family="Arial, sans-serif" font-size="22" fill="#202D40" text-anchor="middle">NHÂN VIÊN</text>
<path d="M260 210 H1010" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#in)"/>
<text x="635" y="200" font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle">1. Thông tin đăng nhập, hồ sơ và cài đặt tài khoản</text>
