<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2050" viewBox="0 0 1900 2050"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#263238" stroke-width="1.5"/></marker></defs><rect x="60" y="845" width="1380" height="600" rx="0" fill="none" stroke="#263238" stroke-width="1.6"/><text x="750.0" y="1151.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a"></text><text x="950.0" y="54.0" font-family="Times New Roman,serif" font-size="27" text-anchor="middle" fill="#17202a">TUẦN TỰ TẠO LỊCH ĐÁNH GIÁ VÀ HIỂN THỊ THÔNG BÁO</text><text x="950.0" y="113.5" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Lịch lưu trong danh_gia_nang_luc.NgayHen • Thông báo được đọc khi nhân viên tải trang</text><rect x="50" y="155" width="240" height="85" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="170.0" y="192.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Trưởng ca</text><text x="170.0" y="215.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Trình duyệt</text><polyline points="170,240 170,1830" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="530" y="155" width="240" height="85" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="650.0" y="192.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Laravel</text><text x="650.0" y="215.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">LeaderEvaluationController</text><polyline points="650,240 650,1830" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="1100" y="155" width="240" height="85" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="1220.0" y="192.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">MySQL</text><text x="1220.0" y="215.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">CSDL BrewLearn</text><polyline points="1220,240 1220,1830" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="1620" y="155" width="240" height="85" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="1740.0" y="192.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Nhân viên</text><text x="1740.0" y="215.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Trình duyệt</text><polyline points="1740,240 1740,1830" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5"/><polyline points="170,330 650,330" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="410.0" y="310.3333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">1. Chọn nhân viên, ngày giờ, tiêu chuẩn và ghi chú</text><polyline points="170,450 650,450" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="410.0" y="419.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">2. POST /leader/create-schedule</text><text x="410.0" y="440.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">(auth; kiểm tra dữ liệu)</text><polyline points="650,580 1220,580" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="935.0" y="549.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">3. BEGIN; khóa nhân viên trong phạm vi ca/cửa hàng</text><text x="935.0" y="570.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Kiểm tra đang làm và không có đánh giá đang xử lý</text><polyline points="650,700 1220,700" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="935.0" y="680.3333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">4. Kiểm tra bài học hoàn thành và từng quiz đạt</text><polyline points="1220,800 650,800" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="935.0" y="780.3333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">5. Trả dữ liệu kiểm tra điều kiện</text><text x="438" y="873.5" font-family="Times New Roman,serif" font-size="18" text-anchor="start" fill="#17202a">alt [hợp lệ và đủ điều kiện]</text><polyline points="650,960 1220,960" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="935.0" y="929.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">6. INSERT danh_gia_nang_luc</text><text x="935.0" y="950.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">NgayHen; TrangThai = ChoDanhGia</text><polyline points="650,1090 1220,1090" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="935.0" y="1059.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">7. INSERT notifications</text><text x="935.0" y="1080.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">user_id; type = schedule; is_read = 0</text><polyline points="650,1200 1220,1200" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="935.0" y="1180.3333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">8. COMMIT</text><polyline points="650,1310 170,1310" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="410.0" y="1290.3333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">9. Chuyển về trang + thông báo thành công</text><rect x="430" y="1350" width="980" height="85" rx="12" fill="#eef4f8" stroke="#263238" stroke-width="1.6"/><text x="920.0" y="1387.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">else [sai phạm vi / trùng / thiếu học hoặc quiz / lỗi ghi]</text><text x="920.0" y="1410.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">ROLLBACK; trả lỗi; không lưu lịch và thông báo từng phần.</text><polyline points="1740,1530 650,1530" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1195.0" y="1510.3333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">10. Nhân viên mở hoặc tải lại trang đăng nhập hợp lệ</text><polyline points="650,1640 1220,1640" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="935.0" y="1620.3333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">11. View composer đọc notifications theo user_id</text><polyline points="1220,1740 650,1740" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="935.0" y="1720.3333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">12. Danh sách thông báo</text><polyline points="650,1830 1740,1830" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1195.0" y="1810.3333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">13. Render giao diện có chuông và thông báo lịch</text><rect x="50" y="1900" width="1800" height="120" rx="12" fill="#fff2cc" stroke="#263238" stroke-width="1.6"/><text x="950.0" y="1943.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Không có bảng lich_danh_gia trong luồng này. Không khẳng định thông báo push / WebSocket.</text><text x="950.0" y="1966.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Điều kiện đầu: nhân viên đã hoàn thành bài học và đạt từng quiz theo DiemChuan.</text><text x="950.0" y="1989.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Nhánh đánh giá lại do quản lý tạo lịch dùng ManagerController::reassess, là luồng khác.</text><polyline points="60,1340 1440,1340" fill="none" stroke="#263238" stroke-width="1.6"/></svg>