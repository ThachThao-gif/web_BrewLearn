oản, nhân sự,</tspan><tspan x="365" dy="19.2">tra cứu, phê duyệt và phân công</tspan></text><text x="835" y="510.4" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#263238"><tspan x="835" dy="0">6. Hồ sơ, thống kê, nguy cơ,</tspan><tspan x="835" dy="19.2">kết quả xử lý và thông báo</tspan></text></svg>
