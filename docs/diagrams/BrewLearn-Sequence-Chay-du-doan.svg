<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1770" viewBox="0 0 1800 1770"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#263238" stroke-width="1.5"/></marker></defs><rect x="450" y="1015" width="1230" height="325" rx="0" fill="none" stroke="#263238" stroke-width="1.6"/><text x="1065.0" y="1183.5" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a"></text><rect x="420" y="660" width="1280" height="820" rx="0" fill="none" stroke="#263238" stroke-width="1.6"/><text x="1060.0" y="1076.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a"></text><text x="900.0" y="54.0" font-family="Times New Roman,serif" font-size="27" text-anchor="middle" fill="#17202a">TUẦN TỰ CHẠY DỰ ĐOÁN THEO LÔ</text><text x="900.0" y="113.5" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Hiện trạng: chạy script riêng; Scheduler chỉ nhắc hạn, chưa có Artisan gọi Python dự đoán</text><rect x="50" y="155" width="240" height="85" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="170.0" y="192.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Người vận hành</text><text x="170.0" y="215.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Terminal</text><polyline points="170,240 170,1580" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="460" y="155" width="240" height="85" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="580.0" y="192.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Python</text><text x="580.0" y="215.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">ket_noi_db.py</text><polyline points="580,240 580,1580" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="910" y="155" width="240" height="85" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="1030.0" y="192.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">MySQL</text><text x="1030.0" y="215.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">CSDL BrewLearn</text><polyline points="1030,240 1030,1580" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="1400" y="155" width="240" height="85" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="1520.0" y="192.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Mô hình + scaler</text><text x="1520.0" y="215.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">predict.py</text><polyline points="1520,240 1520,1580" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5"/><polyline points="170,320 580,320" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="375.0" y="300.3333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">1. Chạy python app/ml/ket_noi_db.py</text><polyline points="580,410 1030,410" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="805.0" y="390.3333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">2. Đọc .env; kết nối PyMySQL</text><polyline points="580,510 1030,510" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="805.0" y="479.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">3. SELECT nhân viên đang làm, có cửa hàng</text><text x="805.0" y="500.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Loại trưởng ca / quản lý</text><polyline points="1030,610 580,610" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="805.0" y="590.3333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">4. Danh sách nhân viên</text><text x="428" y="688.5" font-family="Times New Roman,serif" font-size="18" text-anchor="start" fill="#17202a">loop [từng nhân viên]</text><polyline points="580,770 1030,770" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="805.0" y="750.3333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">5. Đọc tiến độ, lịch sử quiz và lượt học</text><polyline points="1030,870 580,870" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="805.0" y="850.3333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">6. Dữ liệu để tổng hợp 5 biến</text><polyline points="580,940 655,940 655,978 580,978" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="673" y="957.3333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="start" fill="#17202a">7. Tính 5 feature;</text><text x="673" y="978.3333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="start" fill="#17202a">kiểm tra điều kiện dữ liệu</text><text x="428" y="1048.5" font-family="Times New Roman,serif" font-size="18" text-anchor="start" fill="#17202a">alt [quiz_attempts &gt; 0 và learning_visits &gt; 0]</text><polyline points="580,1120 1520,1120" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1050.0" y="1100.3333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">8. predict_risk(5 biến); chuẩn hóa nếu cần</text><polyline points="1520,1220 580,1220" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1050.0" y="1200.3333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">9. predict_proba → xác suất, mức nguy cơ, tên mô hình</text><rect x="630" y="1260" width="990" height="65" rx="12" fill="#eef4f8" stroke="#263238" stroke-width="1.6"/><text x="1125.0" y="1287.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">else [chưa đủ dữ liệu]: không gọi model;</text><text x="1125.0" y="1310.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">ChuaDuDuLieu, diem_rui_ro = NULL</text><polyline points="580,1400 1030,1400" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="805.0" y="1380.3333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">10. INSERT du_doan_nguy_co; COMMIT từng nhân viên</text><polyline points="580,1530 170,1530" fill="none" stroke="#263238" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="375.0" y="1510.3333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">11. In kết quả / hoàn tất</text><rect x="50" y="1620" width="1700" height="120" rx="12" fill="#fff2cc" stroke="#263238" stroke-width="1.6"/><text x="900.0" y="1663.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Nếu một nhân viên lỗi: ROLLBACK bản ghi của người đó và tiếp tục người kế tiếp.</text><text x="900.0" y="1686.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Kết thúc: đóng kết nối. Laravel đọc kết quả đã lưu khi mở trang; không gọi model theo từng yêu cầu web.</text><text x="900.0" y="1709.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Scheduler → Artisan → Python là phương án mở rộng, chưa phải luồng đã triển khai.</text><polyline points="450,1245 1680,1245" fill="none" stroke="#263238" stroke-width="1.6"/></svg>