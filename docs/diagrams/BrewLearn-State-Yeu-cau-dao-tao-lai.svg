<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1770" viewBox="0 0 1650 1770"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#263238" stroke-width="1.5"/></marker></defs><text x="825.0" y="54.0" font-family="Times New Roman,serif" font-size="27" text-anchor="middle" fill="#17202a">VÒNG ĐỜI YÊU CẦU ĐÀO TẠO LẠI QUA NHIỀU VÒNG</text><text x="825.0" y="102.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Cặp trong khối = yeu_cau_dao_tao_lai.trang_thai / tien_trinh</text><text x="825.0" y="125.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Thông tin vòng = retraining_rounds.status / result; các cột vòng là string, không phải enum</text><text x="48" y="177.83333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="start" fill="#17202a">Đầu vào: bản ghi chờ duyệt đã tồn tại</text><polyline points="225,195 225,210" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="60" y="210" width="330" height="95" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="225.0" y="252.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Nhánh xử lý đề xuất có sẵn</text><text x="225.0" y="275.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">trang_thai = ChoDuyet</text><rect x="60" y="420" width="330" height="95" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="225.0" y="462.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Từ chối: TuChoi</text><text x="225.0" y="485.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Nhánh kết thúc xử lý đề xuất</text><ellipse cx="835.0" cy="175.0" rx="10.0" ry="10.0" fill="#263238" stroke="#263238" stroke-width="2"/><text x="835.0" y="181.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a"></text><rect x="610" y="330" width="450" height="110" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="835.0" y="379.5" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Đã duyệt • Chờ giao vòng</text><text x="835.0" y="402.5" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">DaDuyet / ChoGiao</text><rect x="610" y="610" width="450" height="120" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="835.0" y="643.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Đang thực hiện vòng n</text><text x="835.0" y="664.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Yêu cầu: DaDuyet / DangThucHien</text><text x="835.0" y="685.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">retraining_rounds.status = DangThucHien</text><text x="835.0" y="706.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">retraining_rounds.result = ChuaCoKetQua</text><rect x="610" y="935" width="450" height="120" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="835.0" y="968.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Chờ đánh giá lại / phê duyệt vòng n</text><text x="835.0" y="989.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Yêu cầu: DaDuyet / ChoDanhGiaLai</text><text x="835.0" y="1010.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">retraining_rounds.status = ChoDanhGiaLai</text><text x="835.0" y="1031.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">retraining_rounds.result = ChuaCoKetQua</text><rect x="1230" y="935" width="360" height="120" rx="12" fill="white" stroke="#263238" stroke-width="1.6"/><text x="1410.0" y="978.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Hoàn thành yêu cầu</text><text x="1410.0" y="1001.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">HoanThanh / HoanTat</text><text x="1410.0" y="1024.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Kết quả: Dat</text><text x="1170.0" y="244.83333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Duyệt đánh giá chưa đạt có đề xuất</text><text x="1170.0" y="265.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Tạo yêu cầu trực tiếp ở DaDuyet / ChoGiao</text><polyline points="835,185 835,330" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="490.0" y="312.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">QL duyệt đề xuất</text><polyline points="390,257 475,257 475,385 610,385" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="225.0" y="372.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">QL từ chối [có lý do]</text><polyline points="225,305 225,420" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1205.0" y="509.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">QL giao kế hoạch, người phụ trách và hạn</text><text x="1205.0" y="530.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Tạo retraining_rounds với số vòng n</text><polyline points="835,440 835,610" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1225.0" y="834.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">QL tạo lịch đánh giá lại [đủ điều kiện]</text><text x="1225.0" y="855.8333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Học/quiz mới theo kế hoạch + xác nhận đúng người</text><polyline points="835,730 835,935" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1325.0" y="1111.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">QL duyệt đánh giá lại [kết quả Đạt]</text><text x="1325.0" y="1132.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">danh_gia_nang_luc.IsPassed = true</text><text x="1325.0" y="1153.8333333333333" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Lưu vòng: status = DaDuyet; result = Dat</text><polyline points="1060,995 1230,995" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><text x="245.0" y="788.3333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">QL duyệt đánh giá lại [kết quả Chưa đạt]</text><text x="245.0" y="809.3333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">danh_gia_nang_luc.IsPassed = false</text><text x="245.0" y="830.3333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Lưu vòng: status = DaDuyet; result = ChuaDat</text><text x="245.0" y="851.3333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Giữ lịch sử; xóa liên kết lịch cũ</text><text x="245.0" y="872.3333333333334" font-family="Times New Roman,serif" font-size="16" text-anchor="middle" fill="#17202a">Chờ QL chủ động giao vòng n+1</text><polyline points="700,1055 700,1190 480,1190 480,415 610,415" fill="none" stroke="#263238" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="55" y="1230" width="1540" height="165" rx="12" fill="#fff2cc" stroke="#263238" stroke-width="1.6"/><text x="825.0" y="1261.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Cập nhật kế hoạch đang thực hiện: vẫn vòng n.</text><text x="825.0" y="1284.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Đổi người phụ trách / nội dung: xóa xác nhận cũ.</text><text x="825.0" y="1307.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Chưa đủ điều kiện: giữ DangThucHien, không tạo lịch.</text><text x="825.0" y="1330.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Trả lại đánh giá lại: chỉ đổi bản ghi đánh giá sang TraLai;</text><text x="825.0" y="1353.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">yêu cầu vẫn ChoDanhGiaLai, không tạo vòng mới.</text><text x="825.0" y="1376.0" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Chỉ kết quả Đạt đã duyệt mới đóng yêu cầu.</text><rect x="55" y="1430" width="1540" height="190" rx="12" fill="#eef4f8" stroke="#263238" stroke-width="1.6"/><text x="825.0" y="1473.5" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">ĐỐI CHIẾU GIÁ TRỊ VÒNG (retraining_rounds)</text><text x="825.0" y="1496.5" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">status: DangThucHien → ChoDanhGiaLai → DaDuyet</text><text x="825.0" y="1519.5" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">result: ChuaCoKetQua → Dat hoặc ChuaDat sau khi QL duyệt</text><text x="825.0" y="1542.5" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Trả lại / Chờ phê duyệt thuộc bản ghi đánh giá; vòng vẫn ChoDanhGiaLai.</text><text x="825.0" y="1565.5" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">HoanThanh / HoanTat thuộc yêu cầu; vòng đã duyệt giữ DaDuyet và kết quả.</text><text x="825.0" y="1588.5" font-family="Times New Roman,serif" font-size="18" text-anchor="middle" fill="#17202a">Nhánh ChoDuyet chỉ xử lý bản ghi có sẵn: chưa có tuyến tạo đề xuất độc lập được xác minh.</text></svg>