<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1180" viewBox="0 0 1460 1180"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#455a64"/></marker></defs><rect width="1460" height="1180" fill="white"/><text x="730" y="62" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#263238"><tspan x="730" dy="0">DFD NGỮ CẢNH — HỆ THỐNG BREWLEARN</tspan></text><polyline points="260,215 600,215" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="260,280 600,280" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="600,345 260,345" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="600,410 260,410" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="600,475 260,475" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="1200,215 950,215" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="1200,280 950,280" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="1200,345 950,345" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="950,410 1200,410" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="950,475 1200,475" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="950,540 1200,540" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="950,605 1200,605" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="300,1050 300,780 620,780 620,710" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="450,1050 450,850 680,850 680,710" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="600,1050 600,920 760,920 760,710" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="800,710 800,920 950,920 950,1050" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="860,710 860,850 1100,850 1100,1050" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><polyline points="920,710 920,780 1250,780 1250,1050" fill="none" stroke="#455a64" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="60" y="170" width="200" height="340" rx="0" fill="white" stroke="#37474f" stroke-width="1.5"/><text x="160" y="340" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#263238"><tspan x="160" dy="0">NHÂN VIÊN</tspan></text><rect x="1200" y="170" width="200" height="480" rx="0" fill="white" stroke="#37474f" stroke-width="1.5"/><text x="1300" y="410" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#263238"><tspan x="1300" dy="0">TRƯỞNG CA</tspan></text><rect x="200" y="1050" width="1100" height="80" rx="0" fill="white" stroke="#37474f" stroke-width="1.5"/><text x="750" y="1090" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#263238"><tspan x="750" dy="0">QUẢN LÝ CỬA HÀNG</tspan></text><rect x="600" y="170" width="350" height="540" rx="12" fill="white" stroke="#37474f" stroke-width="1.5"/><path d="M600 208 H950" stroke="#37474f" stroke-width="1.3"/><text x="775" y="189" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#263238"><tspan x="775" dy="0">0</tspan></text><text x="775" y="441" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#263238"><tspan x="775" dy="0">HỆ THỐNG</tspan><tspan x="775" dy="36">BREWLEARN</tspan></text><text x="430" y="181" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="430" dy="0">1. Thông tin tài khoản,</tspan><tspan x="430" dy="18">tra cứu chung và hỗ trợ</tspan></text><text x="430" y="246" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="430" dy="0">2. Yêu cầu học tập,</tspan><tspan x="430" dy="18">tiến độ và đáp án kiểm tra</tspan></text><text x="430" y="311" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="430" dy="0">3. Thông tin cá nhân,</tspan><tspan x="430" dy="18">thông báo chung và hỗ trợ</tspan></text><text x="430" y="376" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="430" dy="0">4. Lịch, kết quả đánh giá đã duyệt</tspan><tspan x="430" dy="18">và kế hoạch đào tạo lại</tspan></text><text x="430" y="441" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="430" dy="0">5. Nội dung, tiêu chuẩn,</tspan><tspan x="430" dy="18">tiến độ và kết quả học tập</tspan></text><text x="1075" y="181" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="1075" dy="0">6. Tài khoản, học tập,</tspan><tspan x="1075" dy="18">nhắc việc, sự cố và hỗ trợ</tspan></text><text x="1075" y="246" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="1075" dy="0">7. Lịch đánh giá, điểm,</tspan><tspan x="1075" dy="18">nhận xét và đề xuất</tspan></text><text x="1075" y="311" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="1075" dy="0">8. Yêu cầu nhiệm vụ,</tspan><tspan x="1075" dy="18">xác nhận đào tạo lại</tspan></text><text x="1075" y="376" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="1075" dy="0">9. Thông tin tài khoản, hỗ trợ,</tspan><tspan x="1075" dy="18">kết quả tự học và thông báo</tspan></text><text x="1075" y="441" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="1075" dy="0">10. Thông tin nhân viên,</tspan><tspan x="1075" dy="18">tiến độ học và kết quả quiz</tspan></text><text x="1075" y="506" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="1075" dy="0">11. Lịch, hồ sơ và</tspan><tspan x="1075" dy="18">trạng thái đánh giá</tspan></text><text x="1075" y="571" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="1075" dy="0">12. Nhiệm vụ đào tạo lại,</tspan><tspan x="1075" dy="18">điều kiện và kết quả xác nhận</tspan></text><text x="460" y="746" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="460" dy="0">13. Thông tin tài khoản,</tspan><tspan x="460" dy="18">nhân sự và hỗ trợ</tspan></text><text x="550" y="816" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="550" dy="0">14. Quyết định phê duyệt,</tspan><tspan x="550" dy="18">trả lại / từ chối và lý do</tspan></text><text x="640" y="886" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="640" dy="0">15. Yêu cầu tra cứu, phân công</tspan><tspan x="640" dy="18">và lịch đánh giá lại</tspan></text><text x="940" y="886" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="940" dy="0">16. Thông tin tài khoản, nhân sự,</tspan><tspan x="940" dy="18">thông báo và hỗ trợ</tspan></text><text x="1010" y="816" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="1010" dy="0">17. Hồ sơ đánh giá, lịch sử vòng</tspan><tspan x="1010" dy="18">và kết quả xử lý</tspan></text><text x="1100" y="746" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#263238"><tspan x="1100" dy="0">18. Hồ sơ, thống kê đào tạo</tspan><tspan x="1100" dy="18">và nguy cơ đã lưu</tspan></text></svg>
